name: Create and Build Ai School APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/aishcool/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'Ai School'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.aishcool.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.aishcool.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#7c3aed</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:theme="@style/AppTheme"
                  android:label="Ai School"
                  android:usesCleartextTraffic="true"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/aishcool/app/MainActivity.java <<'EOF'
          package com.aishcool.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <title>Ai School</title>
            <style>
              *{box-sizing:border-box}
              body{margin:0;background:#0b1020;color:#f8fafc;font-family:Inter,Arial,sans-serif}
              .app{min-height:100vh;padding:18px;background:radial-gradient(circle at top,#312e81,#0b1020 55%)}
              .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
              .logo{width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,#8b5cf6,#22d3ee);display:grid;place-items:center;font-size:28px;box-shadow:0 12px 35px #0008}
              h1{margin:0;font-size:26px}
              .sub{color:#cbd5e1;margin-top:4px}
              .card{background:#ffffff12;border:1px solid #ffffff22;border-radius:24px;padding:16px;margin-top:16px;box-shadow:0 20px 50px #0005;backdrop-filter:blur(10px)}
              .row{display:flex;gap:10px;flex-wrap:wrap}
              .btn{border:0;border-radius:16px;padding:13px 15px;background:linear-gradient(135deg,#7c3aed,#06b6d4);color:white;font-weight:800;font-size:15px}
              .btn2{background:#ffffff18;border:1px solid #ffffff22}
              .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
              .stat{border-radius:18px;padding:13px;background:#02061799;text-align:center}
              .num{font-size:22px;font-weight:900}
              .small{font-size:12px;color:#cbd5e1}
              .quest{font-size:20px;font-weight:900;line-height:1.25}
              .answers{display:grid;gap:10px;margin-top:14px}
              .answer{border:1px solid #ffffff22;background:#ffffff12;color:white;border-radius:16px;padding:14px;text-align:left;font-size:16px}
              .answer.ok{background:#16a34a}
              .answer.bad{background:#dc2626}
              .tabs{position:fixed;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;background:#020617d9;border:1px solid #ffffff22;padding:8px;border-radius:22px;backdrop-filter:blur(10px)}
              .tab{border:0;border-radius:16px;padding:10px 2px;background:transparent;color:#cbd5e1;font-size:11px}
              .tab.active{background:#7c3aed;color:white}
              textarea,input{width:100%;border:1px solid #ffffff22;background:#020617aa;color:white;border-radius:16px;padding:13px;font-size:15px}
              .chat{max-height:320px;overflow:auto;display:grid;gap:10px}
              .msg{padding:12px;border-radius:16px;background:#ffffff14}
              .me{background:#2563eb}
              .rank{display:flex;align-items:center;justify-content:space-between;padding:12px;border-radius:16px;background:#ffffff10;margin-top:8px}
            </style>
          </head>
          <body>
            <div class="app">
              <div class="top">
                <div>
                  <h1>Ai School</h1>
                  <div class="sub">Учёба как игра: XP, уровни, ИИ и задания</div>
                </div>
                <div class="logo">🧠</div>
              </div>

              <div class="stats">
                <div class="stat"><div class="num" id="xp">0</div><div class="small">XP</div></div>
                <div class="stat"><div class="num" id="level">1</div><div class="small">Уровень</div></div>
                <div class="stat"><div class="num" id="streak">0</div><div class="small">Серия</div></div>
              </div>

              <section class="card page" id="home">
                <div class="quest">Сканируй модуль учебника или выбери тренировку</div>
                <p class="sub">Пока это первая APK-версия: задания генерируются встроенным учебным движком. Потом подключим Qwen.</p>
                <div class="row">
                  <button class="btn" onclick="showPage('scan')">📷 Сканировать модуль</button>
                  <button class="btn btn2" onclick="startLesson()">🎮 Начать урок</button>
                </div>
              </section>

              <section class="card page" id="scan" hidden>
                <div class="quest">Сканер модуля</div>
                <p class="sub">Вставь тему модуля. Например: English Module 1 Who's who, have got / has got.</p>
                <textarea id="moduleText" rows="6">English Module 1: Who's who? Family, countries, have got / has got, his/her/their.</textarea>
                <button class="btn" onclick="makePlan()">✨ Создать задания</button>
                <div id="plan" class="sub" style="margin-top:12px"></div>
              </section>

              <section class="card page" id="lesson" hidden>
                <div class="small">Задание <span id="qnum">1</span>/10</div>
                <div class="quest" id="question">Нажми начать</div>
                <div class="answers" id="answers"></div>
                <p id="explain" class="sub"></p>
              </section>

              <section class="card page" id="chat" hidden>
                <div class="quest">Чат с ИИ-учителем</div>
                <div class="chat" id="chatBox"></div>
                <input id="chatInput" placeholder="Спроси: почему have, а не has?">
                <button class="btn" onclick="sendChat()">Отправить</button>
              </section>

              <section class="card page" id="rank" hidden>
                <div class="quest">Рейтинг</div>
                <div class="rank"><span>🥇 Ты</span><b id="rankXp">0 XP</b></div>
                <div class="rank"><span>🥈 Friend_01</span><b>260 XP</b></div>
                <div class="rank"><span>🥉 Friend_02</span><b>180 XP</b></div>
                <div class="card">
                  <b>Рефералка:</b>
                  <p class="sub">Твой код: <b>AI-SCHOOL-7291</b>. Друг вводит код → тебе +100 XP, другу +50 XP.</p>
                  <button class="btn" onclick="addXp(100)">Получить тестовый реферальный бонус</button>
                </div>
              </section>

              <div class="tabs">
                <button class="tab active" onclick="showPage('home')">Дом</button>
                <button class="tab" onclick="showPage('scan')">Скан</button>
                <button class="tab" onclick="showPage('lesson')">Урок</button>
                <button class="tab" onclick="showPage('chat')">Чат</button>
                <button class="tab" onclick="showPage('rank')">Топ</button>
              </div>
            </div>

            <script>
              let xp = Number(localStorage.xp || 0);
              let streak = Number(localStorage.streak || 0);
              let current = 0;
              const questions = [
                {q:'My brother ___ got a bike.', a:['have','has','their'], ok:1, e:'brother = he, поэтому has got.'},
                {q:'My brothers ___ got bikes.', a:['has','his','have'], ok:2, e:'brothers = they, поэтому have got.'},
                {q:'Tom has got a dog. ___ dog is black.', a:['His','Her','Their'], ok:0, e:'Tom = he, поэтому his.'},
                {q:'Anna has got a cat. ___ cat is white.', a:['His','Her','Their'], ok:1, e:'Anna = she, поэтому her.'},
                {q:'My parents ___ got a car.', a:['has','have','her'], ok:1, e:'parents = they, поэтому have got.'},
                {q:'My parents have got a car. ___ car is red.', a:['Their','His','Her'], ok:0, e:'parents = they, поэтому their.'},
                {q:'She ___ got blue eyes.', a:['have','has','their'], ok:1, e:'she → has got.'},
                {q:'We ___ got a big family.', a:['has','have','his'], ok:1, e:'we → have got.'},
                {q:'My father has got a phone. ___ phone is new.', a:['Her','Their','His'], ok:2, e:'father = he, поэтому his.'},
                {q:'Tom and Ben ___ got a ball.', a:['has','have','her'], ok:1, e:'Tom and Ben = they, поэтому have got.'}
              ];

              function save(){localStorage.xp=xp;localStorage.streak=streak;renderStats();}
              function renderStats(){
                document.getElementById('xp').textContent=xp;
                document.getElementById('level').textContent=Math.floor(xp/100)+1;
                document.getElementById('streak').textContent=streak;
                document.getElementById('rankXp').textContent=xp+' XP';
              }
              function addXp(n){xp+=n;save();}
              function showPage(id){
                document.querySelectorAll('.page').forEach(p=>p.hidden=true);
                document.getElementById(id).hidden=false;
                document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
                const map={home:0,scan:1,lesson:2,chat:3,rank:4};
                document.querySelectorAll('.tab')[map[id]].classList.add('active');
              }
              function startLesson(){current=0;showPage('lesson');loadQuestion();}
              function loadQuestion(){
                const item=questions[current%questions.length];
                document.getElementById('qnum').textContent=current+1;
                document.getElementById('question').textContent=item.q;
                document.getElementById('explain').textContent='';
                document.getElementById('answers').innerHTML='';
                item.a.forEach((text,i)=>{
                  const b=document.createElement('button');
                  b.className='answer';
                  b.textContent=text;
                  b.onclick=()=>answer(i,b);
                  document.getElementById('answers').appendChild(b);
                });
              }
              function answer(i,btn){
                const item=questions[current%questions.length];
                document.querySelectorAll('.answer').forEach(b=>b.disabled=true);
                if(i===item.ok){
                  btn.classList.add('ok');
                  streak++;
                  addXp(10 + Math.min(streak,5));
                  document.getElementById('explain').textContent='Правильно ✅ +' + (10 + Math.min(streak,5)) + ' XP. ' + item.e;
                } else {
                  btn.classList.add('bad');
                  streak=0;
                  addXp(2);
                  document.getElementById('explain').textContent='Почти ❌ +2 XP. Правильно: ' + item.a[item.ok] + '. ' + item.e;
                }
                save();
                setTimeout(()=>{current++; if(current<10){loadQuestion()} else {document.getElementById('question').textContent='Урок завершён!';document.getElementById('answers').innerHTML='<button class="btn" onclick="startLesson()">Ещё урок</button>';document.getElementById('explain').textContent='Ты получил XP. Уровень обновился.';}},1400);
              }
              function makePlan(){
                const t=document.getElementById('moduleText').value;
                document.getElementById('plan').innerHTML='ИИ понял модуль: <b>'+t+'</b><br>Будут задания: выбор ответа, вставка слов, перевод, мини-контрольная, объяснение ошибок.';
                addXp(5);
              }
              function sendChat(){
                const input=document.getElementById('chatInput');
                const text=input.value.trim();
                if(!text)return;
                const box=document.getElementById('chatBox');
                box.innerHTML += '<div class="msg me">'+text+'</div>';
                let reply='Я помогу. Смотри: have/has = есть, а his/her/their = чей. he → has/his, she → has/her, they → have/their.';
                if(text.toLowerCase().includes('xp')) reply='XP даётся за уроки, серии правильных ответов и рефералов.';
                if(text.toLowerCase().includes('qwen')) reply='Qwen подключим во второй версии через сервер или API. Сейчас работает офлайн-движок.';
                box.innerHTML += '<div class="msg">'+reply+'</div>';
                input.value='';
                box.scrollTop=box.scrollHeight;
              }
              renderStats();
              showPage('home');
            </script>
          </body>
          </html>
          EOF

      - name: Build APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Gradle assembleDebug
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AiSchool-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
